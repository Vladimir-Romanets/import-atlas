<div class="app">
  <aside class="sidebar">
    <div>
      <h1 id="pageTitle"></h1>
      <p class="subtitle" id="pageSubtitle"></p>
    </div>
    <section>
      <h2>Find a file</h2>
      <input
        id="search"
        type="text"
        placeholder="filename or path…"
        autocomplete="off"
      />
      <div class="search-hint" id="searchHint"></div>
    </section>
    <section>
      <h2>View</h2>
      <button
        type="button"
        id="toggleExpand"
        class="switch"
        role="switch"
        aria-checked="false"
        aria-label="Expand or collapse all nodes"
      >
        <span class="switch-track">
          <span class="switch-thumb"></span>
          <span class="switch-text" id="toggleExpandText">Collapsed</span>
        </span>
      </button>
      <button class="ctl" id="fitView" type="button">Fit view</button>
    </section>
    <section class="legend">
      <h2>Layers</h2>
      <ul id="legendList"></ul>
    </section>
    <section>
      <h2>Highest fan-in</h2>
      <table class="stats" id="statsTable"></table>
    </section>
    <section id="warningsSection" hidden>
      <h2>Warnings</h2>
      <div class="warnings" id="warningsList"></div>
    </section>
    <div id="detail" hidden>
      <div class="d-label" id="dLabel"></div>
      <div class="d-path" id="dPath"></div>
      <div class="d-note" id="dNote"></div>
      <div class="d-warn" id="dWarn"></div>
      <div class="d-hint" id="dHint"></div>
    </div>
    <p class="hint">
      Click a node to expand/collapse. Drag to pan, scroll to zoom. A file
      reached from several places opens independently in each of them.
    </p>
  </aside>
  <main class="main">
    <div class="tabs" role="tablist" aria-label="View">
      <button
        type="button"
        class="tab"
        id="tabTree"
        role="tab"
        aria-selected="true"
        aria-controls="panelTree"
      >
        Tree
      </button>
      <button
        type="button"
        class="tab"
        id="tabFindings"
        role="tab"
        aria-selected="false"
        aria-controls="panelFindings"
      >
        Findings <span class="tab-count" id="findingsCount">0</span>
      </button>
    </div>
    <div
      class="panel canvas-wrap"
      id="panelTree"
      role="tabpanel"
      aria-labelledby="tabTree"
    >
      <svg id="canvas" aria-label="Import dependency tree">
        <g id="viewport">
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div class="zoom-controls">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
      </div>
    </div>
    <div
      class="panel findings"
      id="panelFindings"
      role="tabpanel"
      aria-labelledby="tabFindings"
      hidden
    >
      <p class="f-summary" id="findingsSummary"></p>
      <p class="f-caveat" id="findingsCaveat" hidden></p>
      <input
        id="findingsFilter"
        type="text"
        placeholder="filter by name or path…"
        autocomplete="off"
        aria-label="Filter findings"
      />
      <p class="f-empty" id="findingsNoMatches" hidden>No findings match the filter.</p>
      <div id="findingsGroups"></div>
    </div>
  </main>
</div>
<div id="helpModalBackdrop" class="help-modal-backdrop" hidden>
  <div class="help-modal" role="dialog" aria-modal="true" aria-label="Help">
    <button type="button" id="helpModalClose" class="help-modal-close" aria-label="Close">&times;</button>
    <div class="help-modal-body" id="helpModalBody"></div>
  </div>
</div>
